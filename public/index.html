<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart URL Shortener | Premium Link Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }

        .input-group { text-align: left; margin-bottom: 1.5rem; }

        label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        #result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed #10b981;
            border-radius: 16px;
            display: none;
        }

        .success-text { color: #34d399; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.8rem; }
        
        .short-url {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-all;
        }

        .short-url:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SmartURL</h1>
        <p>Shorten, manage, and track your links with cloud speed.</p>

        <div class="input-group">
            <label>Destination URL</label>
            <input type="url" id="longUrl" placeholder="https://github.com/sarash019?tab=repositories..." required>
        </div>

        <div class="input-group">
            <label>Custom Name (Optional)</label>
            <input type="text" id="customSlug" placeholder="e.g. my-portfolio">
        </div>

        <button onclick="shorten()">Shorten URL</button>

        <div id="result">
            <p class="success-text">SUCCESS! YOUR LINK IS READY:</p>
            <a id="shortLink" class="short-url" target="_blank"></a>
        </div>
    </div>

    <script>
        async function shorten() {
            const longUrl = document.getElementById('longUrl').value;
            const customSlug = document.getElementById('customSlug').value;
            const resultDiv = document.getElementById('result');
            const shortLink = document.getElementById('shortLink');

            if (!longUrl) { alert("Please enter a URL"); return; }

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ longUrl, customSlug })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.style.display = 'block';
                    shortLink.href = data.shortUrl;
                    shortLink.innerText = data.shortUrl;
                } else {
                    alert(data.error || "Something went wrong");
                }
            } catch (err) {
                alert("Error connecting to server");
            }
        }
    </script>
</body>
</html>
