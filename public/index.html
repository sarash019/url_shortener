<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyHatke | URL Shortener</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 15px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
        }
        h1 { color: #1a73e8; margin-bottom: 0.5rem; }
        p { color: #5f6368; margin-bottom: 2rem; font-size: 14px; }
        
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #5f6368; margin-bottom: 5px; margin-left: 5px; }
        
        input { 
            width: 93%; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: #1a73e8; }
        
        .custom-slug-input { 
            border-style: dashed; 
            background: #fafafa; 
            font-family: monospace; 
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        button:hover { background: #1557b0; transform: translateY(-1px); }
        button:active { transform: translateY(0px); }

        #result { 
            display: none; 
            margin-top: 2rem; 
            padding: 15px; 
            background: #e8f0fe; 
            border-radius: 8px; 
            border: 1px solid #c6dafc; 
            word-break: break-all; 
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .result-label { font-size: 13px; color: #1a73e8; margin-bottom: 5px; font-weight: bold; }
        a { color: #1a73e8; text-decoration: none; font-size: 18px; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>URL Shortener</h1>
        <p>Create clean, memorable links in seconds.</p>
        
        <div class="input-group">
            <label>LONG URL</label>
            <input type="text" id="longUrl" placeholder="https://github.com/sarash019/project">
        </div>

        <div class="input-group">
            <label>CUSTOM NAME (OPTIONAL)</label>
            <input type="text" id="customSlug" class="custom-slug-input" placeholder="e.g. my-portfolio" oninput="sanitizeInput(this)">
        </div>

        <button onclick="shorten()">Shorten URL</button>
        
        <div id="result">
            <div class="result-label">SUCCESS! YOUR LINK IS READY:</div>
            <a id="shortLink" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        // Real-time sanitization as the user types
        function sanitizeInput(input) {
            let val = input.value;
            // Lowercase, replace spaces with hyphens, remove special characters
            val = val.toLowerCase()
                     .replace(/\s+/g, '-')
                     .replace(/[^a-z0-9-]/g, '');
            input.value = val;
        }

        async function shorten() {
            const longUrl = document.getElementById('longUrl').value.trim();
            const customSlug = document.getElementById('customSlug').value.trim();
            const resBox = document.getElementById('result');
            const linkTag = document.getElementById('shortLink');

            if(!longUrl) {
                alert("Please paste a long URL first!");
                return;
            }

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ longUrl, customSlug })
                });

                const data = await response.json();
                
                if(response.ok) {
                    linkTag.href = data.shortUrl;
                    linkTag.innerText = data.shortUrl;
                    resBox.style.display = 'block';
                    // Scroll to result on small screens
                    resBox.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Ops! " + (data.error || "Something went wrong"));
                }
            } catch (err) {
                console.error(err);
                alert("Server connection failed. Is your Node server running?");
            }
        }
    </script>
</body>
</html>
